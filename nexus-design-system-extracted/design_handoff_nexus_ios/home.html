<!-- @startingPoint section="Marketing" subtitle="Nexus iOS — landing/home: interactive clickthrough prototype (light, accent-free, Notion-style motion)" viewport="900x1000" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nexus iOS — Landing (clickthrough)</title>
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #EDEBE6; }
  * { box-sizing: border-box; }
  #root { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 28px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="landing-kit.jsx"></script>
<script type="text/babel" src="landing-pieces.jsx"></script>
<script type="text/babel" src="landing-app.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "pivotMotion": "slide",
    "motionDuration": 500,
    "motionEasing": "smooth"
  }/*EDITMODE-END*/;

  function App() {
    const [tw, setTweak] = useTweaks(TWEAK_DEFAULTS);
    return (
      <React.Fragment>
        <IOSDevice dark={false}>
          <NexusApp tweaks={tw} />
        </IOSDevice>
        <TweaksPanel>
          <TweakSection label="Pivot motion" />
          <TweakRadio label="Transition" value={tw.pivotMotion} options={['slide', 'fade']}
                      onChange={(v) => setTweak('pivotMotion', v)} />
          <TweakSlider label="Duration" value={tw.motionDuration} min={150} max={700} step={10} unit="ms"
                      onChange={(v) => setTweak('motionDuration', v)} />
          <TweakRadio label="Easing" value={tw.motionEasing} options={['spring', 'smooth', 'snappy']}
                      onChange={(v) => setTweak('motionEasing', v)} />
        </TweaksPanel>
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
