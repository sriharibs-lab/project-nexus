<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FRE Debug</title>
<style>
  body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #eee; }
  .ok  { color: #4ade80; }
  .err { color: #f87171; }
  pre  { background: #2a2a2a; padding: 12px; border-radius: 6px; white-space: pre-wrap; font-size: 13px; }
</style>
</head>
<body>
<h2>fre.html load diagnostics</h2>
<div id="log"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
const log = document.getElementById('log');
const errors = [];

window.onerror = function(msg, src, line, col, err) {
  errors.push({ msg, src: src ? src.split('/').pop() : '?', line, col });
  const p = document.createElement('pre');
  p.className = 'err';
  p.textContent = `ERROR in ${src ? src.split('/').pop() : '?'} line ${line}:\n${msg}`;
  log.appendChild(p);
};

window.addEventListener('unhandledrejection', e => {
  const p = document.createElement('pre');
  p.className = 'err';
  p.textContent = `UNHANDLED PROMISE: ${e.reason}`;
  log.appendChild(p);
});

// Intercept Babel errors
const origConsoleError = console.error.bind(console);
console.error = function(...args) {
  origConsoleError(...args);
  const p = document.createElement('pre');
  p.className = 'err';
  p.textContent = 'console.error: ' + args.map(a => String(a)).join(' ');
  log.appendChild(p);
};
</script>

<script type="text/babel" src="ios-frame.jsx"    data-file="ios-frame.jsx"></script>
<script type="text/babel" src="landing-kit.jsx"  data-file="landing-kit.jsx"></script>
<script type="text/babel" src="landing-pieces.jsx" data-file="landing-pieces.jsx"></script>
<script type="text/babel" src="landing-app.jsx"  data-file="landing-app.jsx"></script>
<script type="text/babel" src="design-canvas.jsx" data-file="design-canvas.jsx"></script>
<script type="text/babel" src="collection-view.jsx" data-file="collection-view.jsx"></script>
<script type="text/babel" src="fre-flow.jsx"     data-file="fre-flow.jsx"></script>
<script type="text/babel" src="fre.jsx"          data-file="fre.jsx"></script>

<script type="text/babel">
const symbols = ['lTheme','L_FONT','LIcon','IOSDevice','NexusApp','Pressable','Segmented',
  'DesignCanvas','DCSection','DCArtboard','CollectionView','CollectionBoard','FREFlow','FRECanvas'];
symbols.forEach(s => {
  const p = document.createElement('pre');
  const ok = typeof window[s] !== 'undefined';
  p.className = ok ? 'ok' : 'err';
  p.textContent = (ok ? '✓ ' : '✗ MISSING: ') + s;
  log.appendChild(p);
});

if (typeof FRECanvas !== 'undefined') {
  const mount = document.createElement('div');
  mount.id = 'fre-mount';
  document.body.appendChild(mount);
  try {
    ReactDOM.createRoot(mount).render(React.createElement(FRECanvas));
    const p = document.createElement('pre');
    p.className = 'ok';
    p.textContent = '✓ FRECanvas rendered OK';
    log.appendChild(p);
  } catch(e) {
    const p = document.createElement('pre');
    p.className = 'err';
    p.textContent = 'FRECanvas render error:\n' + e.message;
    log.appendChild(p);
  }
}
</script>
</body>
</html>
